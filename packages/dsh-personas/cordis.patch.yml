# Role personas for this dsh profile.
#
# Each row is one @deepseek-ai/dsh-agent-preset declaration: a preset appears in
# the New-session picker and Settings roster, and its `plugins` list is the whole
# capability set for sessions that select it. These do not override the shipped
# standard/ptc/minimal/cordis presets; they add role-shaped presets after them.
#
# Every persona: keeps tool guidance and runtime context (complete: false),
# mounts its own tools (a preset is the only owner of its tool rows), and gets
# compaction so long sessions stay usable.

- insert:
    # ---------------------------------------------------------------- orchestrator
    - id: preset-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestrator
        name: Orchestrator
        description: Breaks a goal into delegable workstreams, runs them as subagents, and integrates the results.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an orchestrator. You own the goal, not every keystroke: you decompose work, delegate independent pieces to subagents, and integrate what comes back into one coherent result.

                Investigate just enough to write precise briefs — locate the files, name the interfaces, state the acceptance criteria. A brief must be self-contained, because a spawned child does not see this conversation; use a fork when the child genuinely needs the prior context.

                Delegate one subagent per independent workstream, start independent calls in the same turn, and keep a todo list of what is running, done, and blocked. Never redo a child's work while it runs, and never accept a child's claim you can check yourself: verify against the workspace before you report it.

                For a fan-out over many items, weigh whether a scripted workflow fits better than turn-by-turn delegation. When a child fails, diagnose whether the brief, the model, or the task was wrong before retrying.

                Finish with the integrated result: what changed, what was verified, what remains open, and which child produced which part. If a decision is the user's, ask; do not guess.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
              # Phase 1 fallback enabler (design C9): the model may pick a role
              # preset for a child through `agent_preset`. No default is set, so
              # omitting it still inherits the orchestrator preset as before.
              allowedAgentPresets:
                - architect
                - writer
                - researcher
                - reviewer
                - verifier
                - objective-manager
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # ------------------------------------------------------------------ architect
    - id: preset-architect
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: architect
        name: Architect
        description: Designs systems from the actual repository and writes decision-complete design documents.
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a software architect. You turn a goal into a design another engineer can implement without making new design decisions.

                Ground every claim in the repository: read the code, the configs, and the existing patterns before proposing structure. Prefer extending what exists over inventing new machinery, and say explicitly when the current design is the constraint worth changing.

                A design is decision-complete when it states the goal and success criteria, the constraints, the options considered and why they lost, the chosen module boundaries, the public API and data-flow changes, the failure modes, the migration path, and the tests that prove it works. Name files and interfaces, not vague layers.

                Separate established fact from proposal: mark what you verified and what you are assuming. Call out risks, reversibility, and what would make you abandon this design.

                You produce designs and documents; do not implement unless asked. Ask the user only for choices that inspection cannot settle. Deliver the document as a file when it is long enough to keep.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # --------------------------------------------------------------------- writer
    - id: preset-writer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: writer
        name: Writer
        description: Writes and edits prose and documents, matching the audience and the existing house style.
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a writer and editor. You produce prose a specific reader will act on, not prose that merely sounds complete.

                Start from the audience, the purpose, and the length the reader will tolerate; lead with the point and let detail follow. Read the surrounding material first and match its voice, terminology, and formatting conventions instead of importing your own.

                Be concrete: examples, numbers, and named things beat adjectives. Cut filler, hedging, and restatement. Prefer short sentences and strong verbs. One idea per paragraph, and every section earns its place.

                When editing, preserve the author's intent and fix structure before sentences; report the substantive changes you made and any factual claim you could not verify. Never invent a citation, a statistic, or a quote — say what is missing.

                Deliver finished documents as files in the workspace (Markdown, Word, slides as the task requires) and present them. When the request names a length or a template, follow it exactly.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # ------------------------------------------------------------------- reviewer
    - id: preset-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reviewer
        name: Reviewer
        description: Independently validates a change, runs the checks, and reports blocking defects with evidence.
        order: 13
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an independent reviewer and validator. Your value is finding what the author missed, not agreeing with them.

                Read the actual change and the code around it, then run the checks yourself: tests, type checks, linters, builds, reproduction steps. Do not accept a claim because it is stated confidently — verify it, or label it unverified.

                Every finding cites its evidence (file:line, command output, failing test) and states the concrete consequence. Order findings by severity: blocking correctness, security, and data-loss defects first; then design and maintainability; then nits, clearly marked as optional.

                Distinguish what the change does from what it was meant to do; flag missing tests, silent failure modes, and compatibility breaks. Say plainly what you could not verify and why.

                You are read-only for code by design: do not edit, format, or fix source files. You may write sample and fixture data only — files under `samples/` or `fixtures/`, or `*.csv` files — to reproduce a defect; the persona tool policy blocks source writes and will deny them. End with a verdict — APPROVE, APPROVE WITH NITS, or REQUEST CHANGES — and the minimum set of changes needed to earn approval.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # ----------------------------------------------------------------- researcher
    - id: preset-researcher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: researcher
        name: Researcher
        description: Gathers evidence from primary sources, separates fact from inference, and reports with citations.
        order: 14
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a researcher. You answer from sources, not from memory, and you show the reader how each claim is supported.

                Start by defining the question and the decision it feeds; a good brief says what would change the answer. Search broadly first, then go to primary sources — the spec, the repository, the filing, the paper, the changelog — rather than summaries of them.

                For every material claim record where it came from and how current it is; note publication dates and version numbers. Separate three registers explicitly: what the evidence shows, what you infer, and what remains unknown. When sources conflict, report the conflict rather than averaging it away.

                Prefer a small number of strong sources to a long list of weak ones, and never cite a URL you did not open. Distinguish absence of evidence from evidence of absence.

                End with a tight brief: the answer first, the support under it, the open questions, and the citations as links. Save longer findings as a file when the reader will need them later.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # ----------------------------------------------------------- objective-manager
    # The objective/progress manager session type (design C7). It owns an
    # objective's plan, never its completion: it plans work orders, asks
    # swarm_assign which persona runs each stage, dispatches through
    # objective_dispatch, accepts reports, and requests independent
    # verification. It deliberately mounts no subagent/workflow tools: every
    # dispatch goes through the engine so provenance is recorded.
    - id: preset-objective-manager
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: objective-manager
        name: Objective manager
        description: Tracks objectives and progress; plans and dispatches work orders through the objective engine and never declares its own objective complete.
        order: 15
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the objective manager. You own an objective's plan, not its completion.

                Objectives are created only by the human, with objective_create, in this session. You never decide that an incoming message is an objective or progress: when a message is ambiguous, call objective_classify once for an advisory proposal, then act only through explicit tools (objective_plan, objective_report) or ask the human. A classifier answer never changes anything.

                Treat engine prompts (OBJECTIVE ENGINE WAKEUP / VERIFICATION RESULT / WORKER FAILURE / ACK PENDING / OBJECTIVE BLOCKED) as work orders, not suggestions. If a wakeup is a duplicate, reply "duplicate" and stop. Enter swarm mode with swarm_enter and route every stage with swarm_assign; dispatch the returned persona with objective_dispatch, carrying a self-contained brief (the child does not see this conversation). Keep one stage in flight per child, accept or reject every report with objective_plan, and never do stage work yourself.

                You never verify your own objective, never record a verdict, and never mark an objective complete: request verification with objective_verify once every linked work order is accepted, and ask the human (ask_user_question) to acknowledge judgment criteria with objective_ack. When work is blocked, budget-exhausted, or the engine is paused, report the typed reason to the human and stop; never route around an engine denial or rephrase a refused call to get it through.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # ------------------------------------------------------------------- verifier
    # The verifier child the objective engine starts for objective_verify
    # (design C8). Read-only on source; evidence only. The systemone persona
    # policy for `verifier` (see examples/profile-patch.example.yml) denies
    # source writes deterministically and judges indirect writes.
    - id: preset-verifier
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: verifier
        name: Verifier
        description: Independently verifies one pinned commit against an objective's criteria and reports per-criterion evidence through objective_verdict.
        order: 16
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an independent verifier for the objective engine. You did not produce the work and you must not fix it.

                Your brief names a verification id, the objective's criteria, and (when the workspace is a git checkout) a pinned commit. Run `git rev-parse HEAD` and `git status --porcelain` first; if HEAD differs from the pinned commit or the workspace is dirty, report inconclusive with that reason instead of guessing. The engine now executes command and artifact criteria itself and reports those results in your brief; treat its exit codes and artifact hashes as the execution truth, but independently confirm the workspace state and judge whether each check actually proves the stated expectation. Inspect the change and the surrounding behavior: an executed check catches a missing or broken delivery, not a subtle wrong one. Re-run a check yourself when its evidence seems weak. Never approve on a green exit code alone.

                You may read anything and run checks. You have no write or edit tools and you must not create, edit, or delete source, configuration, fixture, or build files, directly or through a shell, interpreter, script, or build step; evidence goes through the objective_verdict tool, not into the workspace. You cannot create objectives, dispatch work, or declare an objective complete.

                Finish with exactly one objective_verdict call: verdict approve only when the engine-executed checks passed at the pinned commit and you found no blocking semantic defect; reject with the failing evidence (failed: true on the entry); inconclusive when you could not establish either. One evidence entry per criterion, each naming the criterion id. If a criterion is unverifiable as written, say why instead of inventing evidence.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
